r.ReflectionMethod=1

r.SkinCache.CompileShaders=True

r.RayTracing=True

r.RayTracing.RayTracingProxies.ProjectEnabled=True

; Keep every ray tracing geometry resident: with reference-based residency, UE 5.8 evicts geometry the scene did not
; reference once resident geometry passes the pool (400 MB), and the pinned RealtimeMesh asserts on an evicted one
; (RealtimeMeshComponentProxy.cpp:717; upstream PR #304). Crashed voxel.ViewRadius 24 and 32 (far LOD record, 2026-10-11).
r.RayTracing.UseReferenceBasedResidency=False

r.Substrate=True

r.Substrate.ProjectGBufferFormat=0

r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True

r.DefaultFeature.LocalExposure.HighlightContrastScale=0.8

r.DefaultFeature.LocalExposure.ShadowContrastScale=0.8

r.MegaLights.EnableForProject=1

